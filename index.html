<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create and manage notes with QuickNotes.">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>QuickNotes</h1>
      <p>A small API-powered notes client.</p>
    </header>

    <main class="app-main">
      <section class="section-card" aria-labelledby="add-note-heading">
        <h2 id="add-note-heading">Create a note</h2>
        <form id="note-form" novalidate>
          <div class="form-field">
            <label for="title-input">Title</label>
            <input id="title-input" name="title" type="text" maxlength="100" required>
          </div>
          <div class="form-field">
            <label for="body-input">Body (optional)</label>
            <textarea id="body-input" name="body" rows="4"></textarea>
          </div>
          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>

      <section class="section-card" aria-labelledby="notes-heading">
        <div class="notes-toolbar">
          <h2 id="notes-heading">Notes</h2>
          <button id="load-btn" type="button">Load notes</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <ul id="notes-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
